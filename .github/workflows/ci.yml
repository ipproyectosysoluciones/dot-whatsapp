name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:ci
        env:
          ENGRAM_URL: http://localhost:47821
          DOT_WHATSAPP_ENGRAM_PROJECT: dot-whatsapp
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: warn

  conventional-commits:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Check conventional commits
        run: |
          pnpm exec commitlint --from=${{ github.event.pull_request.base.sha }} --to=${{ github.event.pull_request.head.sha }} || {
            echo "::error::Commit messages must follow Conventional Commits. See CONTRIBUTING.md"
            exit 1
          }

  validate-merge-commit:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate merge commit
        run: |
          MERGE_MSG=$(git log -1 --pretty=%B)
          # Accept Conventional Commits (with optional scope), GitHub merge commits
          if ! echo "$MERGE_MSG" | grep -qE '^(feat|fix|docs|chore|refactor|test|merge)(\([^)]+\))?:|^Merge pull request #[0-9]+ from '; then
            echo "::error::Merge commit must follow Conventional Commits: <type>(<scope>): <summary> or GitHub merge format"
            exit 1
          fi

