name: Release

on:
  push:
    tags:
      - "v*"
      - "!v*-*"

# Read-only by default; only release job gets write for publication.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Require successful CI for release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COMMIT=$(git rev-parse HEAD)
          STATUS=$(gh api repos/${{ github.repository }}/commits/${COMMIT}/status --jq '.state')
          if [ "$STATUS" != "success" ]; then
            echo "CI not green for $COMMIT"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Generate changelog (dry-run)
        id: changelog
        run: |
          npx conventional-changelog -p angular -i CHANGELOG.md -s -r 0
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          cat CHANGELOG.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Verify version matches tag
        run: |
          PKG_VERSION=$(cat package.json | jq -r .version)
          TAG_VERSION=${GITHUB_REF_NAME#v}
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

  release:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build release artifacts
        run: |
          # Create release archive with source + docs
          ARCHIVE="dot-whatsapp-${GITHUB_REF_NAME#v}.tar.gz"
          git archive --format=tar.gz --prefix=dot-whatsapp-${GITHUB_REF_NAME#v}/ -o "$ARCHIVE" HEAD
          echo "ARCHIVE=$ARCHIVE" >> $GITHUB_ENV

      - name: Generate checksums
        run: |
          sha256sum "$ARCHIVE" > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ARCHIVE }}
            checksums.txt
          generate_release_notes: false
          body_path: CHANGELOG.md
          draft: false
          prerelease: false

      - name: Update Homebrew tap (if configured)
        if: env.HOMEBREW_TAP_TOKEN != ''
        run: |
          # Optional: update homebrew tap formula
          echo "Homebrew tap update would go here"

  verify:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Verify release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" --json assets --jq '.assets[].name' | while read asset; do
            echo "Verifying $asset..."
            gh release download "${{ github.ref_name }}" -p "$asset" -O "/tmp/$asset"
            # Verify checksum if present
            if [ -f checksums.txt ]; then
              sha256sum -c checksums.txt 2>/dev/null | grep "$asset" || echo "Checksum not in manifest"
            fi
          done